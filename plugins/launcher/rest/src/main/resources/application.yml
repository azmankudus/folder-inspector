micronaut:
  application:
    name: folder-inspector-rest
  server:
    port: 8080
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:folder-inspector-jwt-secret-change-in-production}
        generator:
          access-token:
            expiration: 3600
          refresh-token:
            enabled: true
            secret: ${JWT_REFRESH_SECRET:folder-inspector-refresh-secret-change-in-production}
    intercept-url-map:
      - pattern: /api/v1/auth/**
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /api/v1/**
        access:
          - isAuthenticated()
