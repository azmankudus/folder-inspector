micronaut.application.name=backend
micronaut.server.context-path=/api
micronaut.router.static-resources.default.enabled=true
micronaut.router.static-resources.default.mapping=/**
micronaut.router.static-resources.default.paths=classpath:public

micronaut.security.enabled=true
micronaut.security.authentication=bearer
micronaut.security.endpoints.login.enabled=true
micronaut.security.token.jwt.enabled=true
micronaut.security.token.jwt.signatures.secret.generator.secret=pleaseChangeThisSecretForANewOne
micronaut.security.token.jwt.cookie.enabled=true
micronaut.security.token.jwt.cookie.cookie-name=token
micronaut.security.token.jwt.cookie.cookie-http-only=false
micronaut.security.token.jwt.cookie.cookie-max-age=3600

micronaut.security.intercept-url-map[0].pattern=${micronaut.server.context-path}/login
micronaut.security.intercept-url-map[0].access=isAnonymous()
micronaut.security.intercept-url-map[1].pattern=${micronaut.server.context-path}/oauth/**
micronaut.security.intercept-url-map[1].access=isAnonymous()
micronaut.security.intercept-url-map[2].pattern=${micronaut.server.context-path}/saml/**
micronaut.security.intercept-url-map[2].access=isAnonymous()
micronaut.security.intercept-url-map[3].pattern=${micronaut.server.context-path}/public/**
micronaut.security.intercept-url-map[3].access=isAnonymous()
micronaut.security.intercept-url-map[4].pattern=${micronaut.server.context-path}/**
micronaut.security.intercept-url-map[4].http-method=OPTIONS
micronaut.security.intercept-url-map[4].access=isAnonymous()

micronaut.security.oauth2.clients.azure.client-id=${OAUTH_CLIENT_ID:your-client-id}
micronaut.security.oauth2.clients.azure.client-secret=${OAUTH_CLIENT_SECRET:your-client-secret}
micronaut.security.oauth2.clients.azure.issuer-uri=https://login.microsoftonline.com/${OAUTH_TENANT_ID:common}/v2.0

micronaut.security.redirect.login-success=http://localhost:3000/

micronaut.security.saml.idp-metadata-url=https://example.com/idp
micronaut.security.saml.sp-entity-id=https://your-app.com/saml/metadata
micronaut.security.saml.callback-url=http://localhost:8080${micronaut.server.context-path}/saml/acs

datasources.default.url=jdbc:postgresql://localhost:5432/folderinspector
datasources.default.driverClassName=org.postgresql.Driver
datasources.default.username=folderinspector
datasources.default.password=folderinspector
datasources.default.schema-generate=NONE
datasources.default.dialect=POSTGRES

liquibase.datasources.default.change-log=classpath:db/changelog-master.yaml
liquibase.datasources.default.enabled=true

quartz.enabled=true

application.scan.log.found.size=100
