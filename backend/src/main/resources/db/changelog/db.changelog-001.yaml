databaseChangeLog:
  - changeSet:
      id: "1"
      author: antigravity
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            tableName: user_account
      changes: [ ]
  - changeSet:
      id: "1b"
      author: antigravity
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: user_account
      changes:
        - createTable:
            tableName: user_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
        - createTable:
            tableName: permission
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    nullable: false
        - createTable:
            tableName: user_role
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - createTable:
            tableName: role_permission
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - createTable:
            tableName: connection_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: protocol
                  type: VARCHAR(255)
              - column:
                  name: host
                  type: VARCHAR(255)
              - column:
                  name: port
                  type: INT
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
        - createTable:
            tableName: directory_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ad_host
                  type: VARCHAR(255)
              - column:
                  name: ad_port
                  type: INT
              - column:
                  name: ad_backup_host
                  type: VARCHAR(255)
              - column:
                  name: ad_backup_port
                  type: INT
              - column:
                  name: ad_username
                  type: VARCHAR(255)
              - column:
                  name: ad_password
                  type: VARCHAR(255)
        - createTable:
            tableName: scan_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: connection_profile_id
                  type: BIGINT
              - column:
                  name: root_path
                  type: VARCHAR(255)
              - column:
                  name: scheduler_cron
                  type: VARCHAR(255)
              - column:
                  name: scan_mode
                  type: VARCHAR(50)
        - createTable:
            tableName: scan_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scan_profile_id
                  type: BIGINT
              - column:
                  name: progress
                  type: INT
              - column:
                  name: start_time
                  type: TIMESTAMP
              - column:
                  name: finish_time
                  type: TIMESTAMP
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: process_id
                  type: BIGINT
              - column:
                  name: log_path
                  type: VARCHAR(255)
        - createTable:
            tableName: ad_user_cache
            columns:
              - column:
                  name: sid
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resolution_name
                  type: VARCHAR(255)
  - changeSet:
      id: "2"
      author: antigravity
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: file_node
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE TABLE IF NOT EXISTS file_node (
                id BIGSERIAL,
                scan_history_id BIGINT,
                parent_id BIGINT,
                name TEXT,
                path TEXT,
                node_type TEXT,
                size_bytes BIGINT,
                last_modified TIMESTAMP,
                owner_sid TEXT,
                owner_name TEXT,
                group_sid TEXT,
                group_name TEXT,
                scan_profile_id BIGINT NOT NULL,
                PRIMARY KEY (id, scan_profile_id)
              ) PARTITION BY LIST (scan_profile_id);
              
              CREATE TABLE IF NOT EXISTS file_acl (
                id BIGSERIAL,
                file_node_id BIGINT,
                user_or_group TEXT,
                inheritance_type TEXT,
                can_view BOOLEAN,
                can_add BOOLEAN,
                can_edit BOOLEAN,
                can_remove BOOLEAN,
                scan_profile_id BIGINT NOT NULL,
                PRIMARY KEY (id, scan_profile_id)
              ) PARTITION BY LIST (scan_profile_id);
